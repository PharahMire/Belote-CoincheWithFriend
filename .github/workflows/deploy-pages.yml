name: Deploy PWA to GitHub Pages (with Supabase Secrets)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site & inject Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("_site/index.html", "utf8");
            console.log("SUPABASE_URL present:", Boolean(process.env.SUPABASE_URL));
            console.log("SUPABASE_ANON_KEY present:", Boolean(process.env.SUPABASE_ANON_KEY));
            if (process.env.SUPABASE_URL) {
              html = html.replace("__SUPABASE_URL_PLACEHOLDER__", process.env.SUPABASE_URL.trim());
            }
            if (process.env.SUPABASE_ANON_KEY) {
              html = html.replace("__SUPABASE_ANON_KEY_PLACEHOLDER__", process.env.SUPABASE_ANON_KEY.trim());
            }
            fs.writeFileSync("_site/index.html", html, "utf8");
          '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
